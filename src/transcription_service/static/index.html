<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Локальная транскрибация</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <main id="auth-shell" class="shell auth-shell">
    <header>
      <p class="eyebrow">noScribe · локальная обработка</p>
      <h1>Вход</h1>
      <p class="lede">Введите почту и пароль. При первом посещении зарегистрируйтесь.</p>
    </header>
    <section class="panel auth-panel">
      <form id="auth-form">
        <label>Электронная почта
          <input id="auth-email" type="email" autocomplete="email" required maxlength="254">
        </label>
        <label>Пароль
          <input id="auth-password" type="password" autocomplete="current-password" required minlength="8" maxlength="128">
        </label>
        <div class="auth-actions">
          <button type="submit">Войти</button>
          <button id="register" class="secondary" type="button">Зарегистрироваться</button>
        </div>
      </form>
      <p id="auth-message" role="status"></p>
    </section>
  </main>

  <main id="app-shell" class="shell" hidden>
    <header>
      <p class="eyebrow">noScribe · локальная обработка</p>
      <h1>Транскрибация телемостов</h1>
      <p class="lede">Загрузите WEBM, дождитесь обработки и откройте HTML с таймкодами и метками говорящих.</p>
    </header>

    <section class="panel status-panel">
      <div>
        <span class="label">Состояние</span>
        <strong id="health">Проверка…</strong>
      </div>
      <div class="account">
        <span id="current-user"></span>
        <button id="logout" class="secondary" type="button">Выйти</button>
      </div>
    </section>

    <section class="panel">
      <form id="upload-form">
        <label class="file-drop" for="file">
          <span>Запись встречи в формате .webm</span>
          <input id="file" name="file" type="file" accept=".webm,video/webm" required>
        </label>
        <div class="controls">
          <label>Язык <input id="language" name="language" value="ru" pattern="[A-Za-z]{2,8}|auto"></label>
          <label>Модель
            <select id="model" name="model">
              <option value="precise">precise</option>
              <option value="fast">fast</option>
            </select>
          </label>
          <label>Говорящие
            <select id="speaker_detection" name="speaker_detection">
              <option value="auto">Определить автоматически</option>
              <option value="none">Не определять</option>
              <option value="1">Точно 1</option>
              <option value="2">Точно 2</option>
              <option value="3">Точно 3</option>
              <option value="4">Точно 4</option>
              <option value="5">Точно 5</option>
              <option value="6">Точно 6</option>
              <option value="7">Точно 7</option>
              <option value="8">Точно 8</option>
              <option value="9">Точно 9</option>
              <option value="10">Точно 10</option>
            </select>
          </label>
          <button type="submit">Запустить</button>
        </div>
      </form>
      <p id="message" role="status"></p>
    </section>

    <section>
      <div class="section-title">
        <h2>Задания</h2>
        <button id="refresh" class="secondary" type="button">Обновить</button>
      </div>
      <div id="jobs" class="jobs"></div>
    </section>
  </main>
  <script src="/static/app.js" defer></script>
</body>
</html>
