[project]
name = "local-voice-transcriber"
version = "0.1.0"
description = "Отдельное локальное приложение Transcription Next"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.116,<1",
    "onnx-asr[cpu]==0.12.0",
    "python-multipart>=0.0.20,<1",
    "sherpa-onnx==1.13.7",
    "uvicorn>=0.35,<1",
    "zeusdb-vector-database==0.12.0",
]

[project.scripts]
local-voice-transcriber = "local_voice_transcriber.__main__:main"

[dependency-groups]
dev = [
    "httpx>=0.28,<1",
    "pytest>=8.4,<9",
    "ruff>=0.12,<1",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/local_voice_transcriber"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
