[project]
name = "local-transcription-service"
version = "0.1.0"
description = "Локальный сетевой сервис транскрибации записей через noScribe"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.116",
    "httpx>=0.28",
    "python-dotenv>=1.1",
    "python-multipart>=0.0.20",
    "pywinpty>=3.0.2,<4 ; sys_platform == 'win32'",
    "uvicorn>=0.35",
]

[project.scripts]
transcription-service = "transcription_service.__main__:main"

[dependency-groups]
dev = [
    "jsonschema>=4.25",
    "pytest>=8.4",
    "ruff>=0.12",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/transcription_service"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
